<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIG</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="GIG header">
        <div>
          <h1>GIG</h1>
        </div>
        <div class="status-strip" aria-label="System status">
          <span id="transportStatus">Stopped</span>
          <span id="consoleState">Faders</span>
          <span id="clickStatus">Click Off</span>
          <span id="syncStatus">Local</span>
        </div>
      </section>

      <section class="session-bar" aria-label="Session controls">
        <div>
          <h2 id="sessionName">No session</h2>
          <label class="session-note-field" for="sessionNoteInput">
            <span>Session Notes</span>
            <textarea id="sessionNoteInput" rows="2" autocomplete="off"></textarea>
          </label>
          <button id="saveSessionNoteButton" class="small-action" type="button">Add Note</button>
          <p id="venueNote" class="screen-note">Waiting for Venue.</p>
          <span id="venueStatus" class="screen-note">Venue offline</span>
          <span id="consoleStatus" class="screen-note">Console idle</span>
        </div>
        <div class="toolbar">
          <button id="sessionViewButton" type="button">Session</button>
          <button id="setViewButton" type="button">Set</button>
          <button id="sheetsViewButton" type="button">Sheets</button>
          <button type="button" data-command="click">Click</button>
          <details class="menu">
            <summary>New Track</summary>
            <button type="button" data-command="new guitar track">Guitar</button>
            <button type="button" data-command="new vocal track">Vocal</button>
            <button type="button" data-command="new bass track">Bass</button>
            <button type="button" data-command="new acoustic track">Acoustic</button>
            <button type="button" data-command="new drum overdub track">Drum overdub</button>
          </details>
          <details class="menu">
            <summary>Save Mix</summary>
            <button type="button" data-command="save this mix">Save</button>
            <button type="button" data-command="save as preset">Save preset</button>
            <button type="button" data-command="recall previous mix">Recall previous</button>
            <button type="button" data-command="reset my mix">Reset</button>
          </details>
          <div class="transport" aria-label="Transport">
            <button type="button" data-command="record all">Record</button>
            <button type="button" data-command="play">Play</button>
            <button type="button" data-command="stop">Stop</button>
          </div>
          <button type="button" data-command="open my console">Console</button>
          <button type="button" data-command="open venue console">Venue Console</button>
        </div>
      </section>

      <section id="sessionView" class="screen-view" hidden aria-label="Session browser">
        <div class="screen-head">
          <div>
            <p class="eyebrow">Session</p>
            <h2>Choose Session</h2>
          </div>
          <button id="closeSessionViewButton" type="button">Done</button>
        </div>
        <div class="session-actions">
          <button id="newSessionButton" type="button">New Session</button>
        </div>
        <div id="newSessionPanel" class="inline-panel" hidden>
          <label class="name-field" for="newSessionNameInput">
            <span>Session Title</span>
            <input id="newSessionNameInput" type="text" autocomplete="off" />
          </label>
          <div class="inline-actions">
            <button id="createSessionButton" type="button">Create</button>
            <button id="cancelNewSessionButton" type="button">Cancel</button>
          </div>
        </div>
        <div id="editSessionPanel" class="inline-panel" hidden>
          <label class="name-field" for="editSessionNameInput">
            <span>Edit Title</span>
            <input id="editSessionNameInput" type="text" autocomplete="off" />
          </label>
          <div class="inline-actions">
            <button id="saveSessionTitleButton" type="button">Save</button>
            <button id="cancelEditSessionButton" type="button">Cancel</button>
          </div>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>

      <section id="setView" class="screen-view" hidden aria-label="Set browser">
        <div class="screen-head">
          <div>
            <p class="eyebrow">Set</p>
            <h2>Choose Set</h2>
          </div>
          <button id="closeSetViewButton" type="button">Done</button>
        </div>
        <div class="session-actions">
          <button id="buildSetViewButton" type="button">Build From Session</button>
        </div>
        <div id="editSetPanel" class="inline-panel" hidden>
          <label class="name-field" for="editSetNameInput">
            <span>Edit Set</span>
            <input id="editSetNameInput" type="text" autocomplete="off" />
          </label>
          <div class="inline-actions">
            <button id="saveSetTitleButton" type="button">Save</button>
            <button id="addSetSongsButton" type="button">Add Songs</button>
            <button id="cancelEditSetButton" type="button">Cancel</button>
          </div>
          <div id="editSetSongs" class="session-list compact-list"></div>
          <div id="addSetSongsPanel" class="add-song-panel" hidden>
            <p class="eyebrow">Available Songs</p>
            <div id="availableSetSongs" class="session-list compact-list"></div>
          </div>
        </div>
        <div id="setList" class="session-list"></div>
        <div id="activeSetSongs" class="set-song-list"></div>
      </section>

      <section id="buildSetView" class="screen-view" hidden aria-label="Build set from session">
        <div class="screen-head">
          <div>
            <p class="eyebrow">Set Builder</p>
            <h2>Build From Session</h2>
          </div>
          <button id="closeBuildSetViewButton" type="button">Done</button>
        </div>
        <div class="session-actions">
          <label class="name-field" for="buildSetNameInput">
            <span>Set Name</span>
            <input id="buildSetNameInput" type="text" autocomplete="off" />
          </label>
          <button id="saveBuiltSetButton" type="button">Save Set</button>
        </div>
        <div id="buildSongList" class="session-list"></div>
      </section>

      <section id="sheetsView" class="screen-view" hidden aria-label="Sheets browser">
        <div class="screen-head">
          <div>
            <p class="eyebrow">Sheets</p>
            <h2>Choose Sheet</h2>
          </div>
          <button id="closeSheetsViewButton" type="button">Done</button>
        </div>
        <div id="sheetsList" class="session-list"></div>
      </section>

      <section class="workspace" aria-label="GIG workspace">
        <section class="mixer-panel" aria-label="Touch mixer">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Mix</p>
              <h2 id="mixName">My Mix</h2>
            </div>
          </div>
          <section class="master-strip" aria-label="Master volume">
            <div>
              <strong>Master</strong>
              <span>Personal mix</span>
            </div>
            <input id="masterFader" type="range" min="0" max="100" value="72" aria-label="Master volume" />
            <button id="masterMuteButton" type="button">Mute</button>
          </section>
          <div id="channelGrid" class="channel-grid"></div>
        </section>

        <aside class="side-panel" aria-label="Voice command">
          <section class="command-panel" aria-label="Voice command surface">
            <div class="control-head">
              <h2>Control</h2>
              <button id="voiceOrb" class="voice-orb" type="button" aria-label="Voice control"></button>
            </div>

            <strong id="assistStatus" class="control-status">Ready</strong>

            <form id="commandForm" class="command-form">
              <input
                id="commandInput"
                type="text"
                autocomplete="off"
                placeholder="Try: more vocal in my mix"
                aria-label="Command"
              />
              <button type="submit">Send</button>
            </form>
          </section>
        </aside>
      </section>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
