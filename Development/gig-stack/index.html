<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIG</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="GIG header">
        <div>
          <h1>GIG</h1>
        </div>
        <div class="status-strip" aria-label="System status">
          <span id="transportStatus">Stopped</span>
          <span id="consoleState">Faders</span>
          <span id="syncStatus">Local</span>
        </div>
      </section>

      <section class="session-bar" aria-label="Session controls">
        <div>
          <h2 id="sessionName">No session</h2>
          <p id="venueNote" class="screen-note">Waiting for Venue.</p>
          <span id="venueStatus" class="screen-note">Venue offline</span>
          <span id="consoleStatus" class="screen-note">Console idle</span>
        </div>
        <div class="toolbar">
          <details class="menu">
            <summary>Session</summary>
            <button type="button" data-command="new session">New</button>
            <button type="button" data-command="open previous session">Previous</button>
          </details>
          <details class="menu">
            <summary>New Track</summary>
            <button type="button" data-command="new guitar track">Guitar</button>
            <button type="button" data-command="new vocal track">Vocal</button>
            <button type="button" data-command="new bass track">Bass</button>
            <button type="button" data-command="new acoustic track">Acoustic</button>
            <button type="button" data-command="new drum overdub track">Drum overdub</button>
          </details>
          <details class="menu">
            <summary>Save Mix</summary>
            <button type="button" data-command="save this mix">Save</button>
            <button type="button" data-command="save as preset">Save preset</button>
            <button type="button" data-command="recall previous mix">Recall previous</button>
            <button type="button" data-command="reset my mix">Reset</button>
          </details>
          <div class="transport" aria-label="Transport">
            <button type="button" data-command="record all">Record</button>
            <button type="button" data-command="play">Play</button>
            <button type="button" data-command="stop">Stop</button>
          </div>
          <button type="button" data-command="open my console">Console</button>
          <button type="button" data-command="open venue console">Venue Console</button>
        </div>
      </section>

      <section class="workspace" aria-label="GIG workspace">
        <section class="mixer-panel" aria-label="Touch mixer">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Mix</p>
              <h2 id="mixName">My Mix</h2>
            </div>
          </div>
          <section class="master-strip" aria-label="Master volume">
            <div>
              <strong>Master</strong>
              <span>Personal mix</span>
            </div>
            <input id="masterFader" type="range" min="0" max="100" value="72" aria-label="Master volume" />
            <button id="masterMuteButton" type="button">Mute</button>
          </section>
          <div id="channelGrid" class="channel-grid"></div>
        </section>

        <aside class="side-panel" aria-label="Takes sets and voice commands">
          <section class="command-panel" aria-label="Voice command surface">
            <div class="control-head">
              <h2>Control</h2>
              <button id="voiceOrb" class="voice-orb" type="button" aria-label="Voice control"></button>
            </div>

            <div class="assist-card">
              <strong id="assistStatus">Console Assist: Offline</strong>
              <span id="assistDetail">Waiting for Venue.</span>
            </div>

            <form id="commandForm" class="command-form">
              <input
                id="commandInput"
                type="text"
                autocomplete="off"
                placeholder="Try: more vocal in my mix"
                aria-label="Command"
              />
              <button type="submit">Send</button>
            </form>

            <div class="quick-commands" aria-label="Quick commands">
              <button type="button" data-command="open drums">Open drums</button>
              <button type="button" data-command="open my console">Console</button>
              <button type="button" data-command="make vocal louder">Vocal up</button>
              <button type="button" data-command="shape snare target">Snare assist</button>
              <button type="button" data-command="turn drums down">Drums down</button>
              <button type="button" data-command="open venue console">Venue Console</button>
            </div>

            <ol id="commandLog" class="command-log" aria-label="Command log"></ol>
          </section>

          <section class="list-panel" aria-label="Takes">
            <div class="panel-head compact">
              <h2>Takes</h2>
            </div>
            <div id="takesList" class="stack-list"></div>
          </section>

          <section class="list-panel" aria-label="Sets">
            <div class="panel-head compact">
              <h2>Sets</h2>
            </div>
            <div id="setList" class="stack-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
