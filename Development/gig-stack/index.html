<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIG</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="GIG header">
        <div>
          <p class="eyebrow">Musician remote</p>
          <h1>GIG</h1>
        </div>
        <div class="status-strip" aria-label="System status">
          <span id="venueStatus">Venue offline</span>
          <span id="consoleStatus">Console idle</span>
          <span id="transportStatus">Stopped</span>
          <span id="syncStatus">Local</span>
        </div>
      </section>

      <section class="session-bar" aria-label="Session controls">
        <div>
          <p class="eyebrow">Session</p>
          <h2 id="sessionName">No session</h2>
          <p id="venueNote">Waiting for Venue.</p>
        </div>
        <div class="transport">
          <button type="button" data-command="new session">New session</button>
          <button type="button" data-command="open previous session">Open previous</button>
          <button type="button" data-command="record all">Record all</button>
          <button type="button" data-command="play">Play</button>
          <button type="button" data-command="stop">Stop</button>
          <button type="button" data-command="save this mix">Save mix</button>
          <button type="button" data-command="move this session to set">To set</button>
        </div>
      </section>

      <section class="workspace" aria-label="GIG workspace">
        <section class="mixer-panel" aria-label="Touch mixer">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Mix</p>
              <h2>Channels</h2>
            </div>
          </div>
          <div id="channelGrid" class="channel-grid"></div>
        </section>

        <aside class="side-panel" aria-label="Takes sets and voice commands">
          <section class="command-panel" aria-label="Voice command surface">
            <div class="panel-head compact">
              <div>
                <p class="eyebrow">Say it or tap it</p>
                <h2>Control</h2>
              </div>
            </div>

            <form id="commandForm" class="command-form">
              <input
                id="commandInput"
                type="text"
                autocomplete="off"
                placeholder="Try: make vocal louder"
                aria-label="Command"
              />
              <button type="submit">Send</button>
            </form>

            <div class="quick-commands" aria-label="Quick commands">
              <button type="button" data-command="open drums">Open drums</button>
              <button type="button" data-command="mute guitar">Mute guitar</button>
              <button type="button" data-command="make vocal louder">Vocal up</button>
              <button type="button" data-command="compress bass">Bass comp</button>
              <button type="button" data-command="brighten acoustic">Bright acoustic</button>
              <button type="button" data-command="turn drums down">Drums down</button>
            </div>

            <ol id="commandLog" class="command-log" aria-label="Command log"></ol>
          </section>

          <section class="list-panel" aria-label="Takes">
            <div class="panel-head compact">
              <h2>Takes</h2>
            </div>
            <div id="takesList" class="stack-list"></div>
          </section>

          <section class="list-panel" aria-label="Sets">
            <div class="panel-head compact">
              <h2>Sets</h2>
            </div>
            <div id="setList" class="stack-list"></div>
          </section>
        </aside>
      </section>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
